# Three ways a binary leaves this repository, and one file for all three so they
# are read together: a `v*` tag cuts a version, every push to main refreshes the
# single rolling pre-release named `edge`, and Run workflow on the Actions tab
# cuts a version from the branch it is run on, for an environment that cannot
# push a tag. The `if:` on each job keeps the three apart — a tag push runs
# `release` only, a branch push runs `edge` only, a dispatch runs `cut` only.
#
# The dispatch job publishes its release itself instead of handing the tag to
# `release`: a tag pushed with GITHUB_TOKEN starts no workflow run, so nothing
# would ever pick that tag up.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'the version to cut, e.g. v0.1.0 (must start with v)'
        required: true
        type: string

# Each job asks for the token it needs, and asks in its own block: all three
# publish, so all three carry `contents: write`, and a job added later that
# only builds starts from nothing rather than inheriting a token that can write.
jobs:
  # A tag is a name someone chose, so it is tested before it is published.
  release:
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: the release notes are the commit subjects since
          # the previous tag.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./... -count=1 -timeout 40m
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # main is always downloadable. The suite already ran on the pull request, so
  # this job only builds.
  edge:
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # goreleaser reads the repository's state; give it an unshallow one.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      # A snapshot needs no tag: the four binaries call themselves
      # edge-<short sha> (see snapshot.version_template in .goreleaser.yaml).
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --snapshot --clean
      # One pre-release, replaced each time, so `edge` is a link that never
      # goes stale and never accumulates a version's worth of noise.
      - name: publish the edge pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          short=$(printf '%s' "$SHA" | cut -c1-7)
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge \
            --target "$SHA" \
            --prerelease \
            --title "edge ($short)" \
            --notes "Rolling build of main at $SHA. Not a version." \
            dist/*.tar.gz dist/checksums.txt

  # The Actions tab: type the version into Run workflow, and this job does what
  # a tag push would have done, in that order — the two checks, then the suite,
  # then the tag, then the release. The version is cut from whichever branch the
  # workflow was run on, which is main unless you pick another one.
  cut:
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: the release notes are the commit subjects since
          # the previous tag, and goreleaser reads the version from the tag that
          # `git describe` finds here.
          fetch-depth: 0
      # Both checks come before anything is built: the answers are already known
      # at this point, and neither is worth a suite's forty minutes to learn.
      - name: check the version is a version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$VERSION is not a version. Give v then MAJOR.MINOR.PATCH, with an optional suffix: v0.1.0, v0.2.0-rc1."
            exit 1
          fi
      - name: check the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            echo "::error::the tag $VERSION is already on origin. A version is named once; cut the next number."
            exit 1
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # A version is tested before it is named: the suite runs on the commit the
      # workflow was run on, and the tag is written only if it passes.
      - name: test
        run: go test ./... -count=1 -timeout 40m
      - name: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "compass $VERSION"
          git push origin "refs/tags/$VERSION"
      # The tag above was written at this commit, so goreleaser sees the version
      # it needs. This job publishes rather than leaving it to `release`: a tag
      # pushed with GITHUB_TOKEN starts no workflow run, so `release` would
      # never see this tag at all.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
