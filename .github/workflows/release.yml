# Two ways a binary leaves this repository, and one file for both so the pair
# is read together: a `v*` tag cuts a version, and every push to main refreshes
# the single rolling pre-release named `edge`. The `if:` on each job keeps them
# apart — a tag push runs `release` only, a branch push runs `edge` only.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A tag is a name someone chose, so it is tested before it is published.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the release notes are the commit subjects since
          # the previous tag.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./... -count=1 -timeout 40m
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # main is always downloadable. The suite already ran on the pull request, so
  # this job only builds.
  edge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser reads the repository's state; give it an unshallow one.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      # A snapshot needs no tag: the four binaries call themselves
      # edge-<short sha> (see snapshot.version_template in .goreleaser.yaml).
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --clean
      # One pre-release, replaced each time, so `edge` is a link that never
      # goes stale and never accumulates a version's worth of noise.
      - name: publish the edge pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          short=$(printf '%s' "$SHA" | cut -c1-7)
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge \
            --target "$SHA" \
            --prerelease \
            --title "edge ($short)" \
            --notes "Rolling build of main at $SHA. Not a version." \
            dist/*.tar.gz dist/checksums.txt
