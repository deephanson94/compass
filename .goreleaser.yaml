# How a compass release is built. One binary, four machines, one archive each.
# Run by .github/workflows/release.yml: `release --clean` on a v* tag. Try it
# locally with:
#
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish
version: 2

builds:
  - id: compass
    main: ./cmd/compass
    binary: compass
    env:
      # No cgo: one static binary that runs wherever the kernel matches.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # -s -w drops the symbol table and debug info; the -X stamps the tag over
    # `var version = "dev"` in cmd/compass, which `compass -version` prints.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Date the binary from the commit, not from the clock, so the same commit
    # built twice gives the same bytes.
    mod_timestamp: '{{ .CommitTimestamp }}'

# A snapshot has no tag to take its version from. Nothing publishes one any
# more — it is the local dry run — so it wears the working tree's own word.
snapshot:
  version_template: 'dev-{{ .ShortCommit }}'

archives:
  - formats: [tar.gz]
    name_template: 'compass_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    # The binary, plus the one document that says what it is. There is no
    # LICENSE file in the repository yet; add it to this list when there is.
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  # The notes are the commit subjects since the previous version. Test,
  # documentation and chore commits are housekeeping, not news: a settings file
  # nobody downloading a binary can see is not a change to that binary. The
  # three excluded prefixes are the three that name an audience of nobody —
  # PROCESS section 6 says how a prefix is chosen, and why `release:` is not on
  # this list even when the commit only moves the plumbing.
  # `sort: asc` sorts the subjects, not the history — goreleaser orders the
  # lines it printed — so the notes arrive grouped by the area each subject
  # names rather than as a timeline. There is no oldest-first to ask for here.
  use: git
  sort: asc
  # The subject is the line; the hash in front of it is noise on a page whose
  # reader came for the binary. -1 drops it (0 would keep the whole forty
  # characters, which is what v0.4.0's notes were published with).
  abbrev: -1
  filters:
    exclude:
      - '^tests:'
      - '^docs:'
      - '^chore:'

release:
  # A 0.x tag is an ordinary release: the major version, not a flag, is what
  # says the SPEC still moves. `auto` marks a release as a pre-release when the
  # tag itself carries a suffix (v0.2.0-rc1), and nothing else is one.
  prerelease: auto
