# How a compass release is built. One binary, four machines, one archive each.
# Run by .github/workflows/release.yml: `release --clean` on a v* tag, and
# `release --snapshot --clean` on every push to main for the rolling `edge`
# pre-release. Try it locally with:
#
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish
version: 2

builds:
  - id: compass
    main: ./cmd/compass
    binary: compass
    env:
      # No cgo: one static binary that runs wherever the kernel matches.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # -s -w drops the symbol table and debug info; the -X stamps the tag over
    # `var version = "dev"` in cmd/compass, which `compass -version` prints.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Date the binary from the commit, not from the clock, so the same commit
    # built twice gives the same bytes.
    mod_timestamp: '{{ .CommitTimestamp }}'

# A snapshot has no tag to take its version from; main's builds call themselves
# edge-<short sha>, which is what `compass -version` then says.
snapshot:
  version_template: 'edge-{{ .ShortCommit }}'

archives:
  - formats: [tar.gz]
    name_template: 'compass_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    # The binary, plus the one document that says what it is. There is no
    # LICENSE file in the repository yet; add it to this list when there is.
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'

# Which tags count when the previous version is looked for. `edge` is the
# rolling pre-release that every push to main deletes and writes again: it names
# the latest build of main, not a version, so it must never be the boundary the
# notes are measured from. Left in, it is the tag one merge back, and a release
# gets the commits since the last merge instead of the commits since the last
# version — which is what the first cut, v0.1.0, got.
git:
  ignore_tags:
    - edge

changelog:
  # The notes are the commit subjects since the previous version. Test,
  # documentation and chore commits are housekeeping, not news: a settings file
  # nobody downloading a binary can see is not a change to that binary.
  # `sort: asc` sorts the subjects, not the history — goreleaser orders the
  # lines it printed — so the notes arrive grouped by the area each subject
  # names rather than as a timeline. There is no oldest-first to ask for here.
  use: git
  sort: asc
  filters:
    exclude:
      - '^tests:'
      - '^docs:'
      - '^chore:'

release:
  # A 0.x tag is an ordinary release: the major version, not a flag, is what
  # says the SPEC still moves. `auto` marks a release as a pre-release when the
  # tag itself carries a suffix (v0.2.0-rc1), so `edge` is the only standing
  # pre-release.
  prerelease: auto
